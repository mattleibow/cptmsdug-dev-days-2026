name: MAUI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            framework: net11.0-android
            workload: maui-android
          - platform: ios
            os: macos-26
            framework: net11.0-ios
            workload: maui-ios
          - platform: maccatalyst
            os: macos-26
            framework: net11.0-maccatalyst
            workload: maui-maccatalyst
          - platform: windows
            os: windows-latest
            framework: net11.0-windows10.0.19041.0
            workload: maui-windows
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up Java
        if: runner.os == 'Linux'
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Set up Android SDK
        if: runner.os == 'Linux'
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
          log-accepted-android-sdk-licenses: false

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install MAUI workloads
        run: dotnet workload install ${{ matrix.workload }} --skip-manifest-update

      - name: Set NuGet cache path
        run: '"NUGET_PACKAGES=$(Join-Path $env:RUNNER_TEMP nuget-packages)" >> $env:GITHUB_ENV'

      - name: Cache NuGet packages
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-nuget-v2-${{ hashFiles('global.json') }}-${{ hashFiles('dotnet-tools.json', 'demos/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-nuget-v2-${{ hashFiles('global.json') }}-

      - name: Restore solution
        run: >-
          dotnet restore MauiDemos.slnx
          -p:Configuration=Debug
          -p:TargetFramework=${{ matrix.framework }}
          -p:TargetFrameworks=${{ matrix.framework }}
          -p:ContinuousIntegrationBuild=true
          -p:EnableCodeSigning=false
          "-bl:artifacts/restore.binlog;ProjectImports=None"

      - name: Build solution
        run: >-
          dotnet build MauiDemos.slnx --configuration Debug --no-restore
          -p:TargetFramework=${{ matrix.framework }}
          -p:TargetFrameworks=${{ matrix.framework }}
          -p:ContinuousIntegrationBuild=true
          -p:EnableCodeSigning=false
          ${{ runner.os == 'Windows' && '-maxcpucount:4' || '' }}
          "-bl:artifacts/build.binlog;ProjectImports=None"
          -clp:PerformanceSummary

      - name: Upload build binlogs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binlogs-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: artifacts/*.binlog
          if-no-files-found: warn
          retention-days: 7
