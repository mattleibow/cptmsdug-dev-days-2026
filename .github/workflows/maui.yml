name: MAUI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      use-caches:
        description: Restore and save SDK/workload and NuGet caches
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["macos-26"]' || '["ubuntu-latest", "macos-26", "windows-latest"]') }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set isolated .NET path
        run: |
          "DOTNET_INSTALL_DIR=$(Join-Path $env:RUNNER_TEMP dotnet)" >> $env:GITHUB_ENV

      - name: Cache .NET SDK and workloads
        if: runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || inputs.use-caches)
        uses: actions/cache@v4
        with:
          path: ${{ env.DOTNET_INSTALL_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-dotnet-v1-${{ hashFiles('global.json', 'demos/**/*.csproj') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up Java
        if: runner.os != 'macOS'
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Set up Android SDK
        if: runner.os != 'macOS'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install MAUI workloads
        run: dotnet workload restore MauiDemos.slnx --skip-manifest-update

      - name: Set NuGet cache path
        run: '"NUGET_PACKAGES=$(Join-Path $env:RUNNER_TEMP nuget-packages)" >> $env:GITHUB_ENV'

      - name: Cache NuGet packages
        if: runner.os != 'Windows' && (github.event_name != 'workflow_dispatch' || inputs.use-caches)
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-v2-${{ hashFiles('global.json') }}-${{ hashFiles('dotnet-tools.json', 'demos/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-v2-${{ hashFiles('global.json') }}-

      - name: Install Android SDK dependencies
        if: runner.os != 'macOS'
        run: >-
          dotnet build MauiDemos.slnx -t:InstallAndroidDependencies
          -f net11.0-android
          -p:TargetFrameworks=net11.0-android
          -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          -p:JavaSdkDirectory="$env:JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True
          "-bl:artifacts/android-dependencies.binlog;ProjectImports=None"

      - name: Build solution
        run: >-
          dotnet build MauiDemos.slnx --configuration Debug
          -p:ContinuousIntegrationBuild=true
          -p:EnableCodeSigning=false
          ${{ runner.os != 'macOS' && '-p:AndroidSdkDirectory="$env:ANDROID_HOME"' || '' }}
          ${{ runner.os != 'macOS' && '-p:JavaSdkDirectory="$env:JAVA_HOME"' || '' }}
          ${{ runner.os == 'Windows' && '-maxcpucount:4' || '' }}
          "-bl:artifacts/build.binlog;ProjectImports=None"
          -clp:PerformanceSummary

      - name: Upload build binlogs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binlogs-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: artifacts/*.binlog
          if-no-files-found: warn
          retention-days: 7
